{% extends 'base.html' %}
{% block title %}Shorts — NEXUS{% endblock %}
{% block content %}
<div id="shorts-root" style="position:fixed;inset:0;background:#000;z-index:400;overflow-y:scroll;scroll-snap-type:y mandatory;">
  <a href="/" style="position:fixed;top:16px;left:16px;z-index:410;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:16px;"><i class="fa-solid fa-arrow-left"></i></a>

  <div id="short-tap-hint" style="position:fixed;top:64px;right:16px;z-index:411;background:rgba(0,0,0,.65);color:#fff;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:16px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;">🔊 Tap the speaker for sound</div>

  {% if shorts %}
  <div id="short-slides">{% include 'shorts/_slides.html' %}</div>
  {% else %}
  <div style="height:100vh;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);flex-direction:column;gap:10px;">
    <div style="font-size:40px;">🎬</div>
    <div>No shorts yet — check back soon.</div>
  </div>
  {% endif %}
  <div id="short-loading-more" style="display:none;height:60px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:12px;">Loading more…</div>
</div>

<script>
(function(){
  const root = document.getElementById('shorts-root');
  const slidesWrap = document.getElementById('short-slides');
  let slides = [...document.querySelectorAll('.short-slide')];
  let ytPlayers = {};
  let ytApiReady = false;

  // Sound preference persists across visits (localStorage), not just this
  // page load — every fresh visit used to silently reset to muted with no
  // obvious way to tell that was even the state. We still have to start
  // every autoplay muted (mobile browsers block unmuted autoplay outright),
  // but we restore the user's choice the moment the page is interactive.
  let muted = localStorage.getItem('nexus_shorts_muted') !== '0';

  function setMuteIcon(){
    document.querySelectorAll('.short-mute-btn i').forEach(i=>{
      i.className = muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
    });
  }
  setMuteIcon();

  if(muted && !localStorage.getItem('nexus_shorts_hint_seen')){
    const hint = document.getElementById('short-tap-hint');
    setTimeout(()=>{ hint.style.opacity = '1'; }, 700);
    setTimeout(()=>{ hint.style.opacity = '0'; }, 4200);
    localStorage.setItem('nexus_shorts_hint_seen', '1');
  }

  function maybeLoadYT(){
    if(window.__nexusYtLoading) { if(ytApiReady) initYT(); return; }
    if(!slides.some(s=>s.dataset.youtube==='1')) return;
    window.__nexusYtLoading = true;
    const tag=document.createElement('script'); tag.src='https://www.youtube.com/iframe_api';
    document.body.appendChild(tag);
    window.onYouTubeIframeAPIReady = function(){ ytApiReady = true; initYT(); };
  }
  maybeLoadYT();

  function ytId(url){
    const m = url.match(/(?:v=|youtu\.be\/|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : '';
  }

  function initYT(){
    slides.forEach(slide=>{
      if(slide.dataset.youtube!=='1') return;
      const wrap = slide.querySelector('.short-yt-wrap');
      if(!wrap || wrap.dataset.ready) return;
      wrap.dataset.ready='1';
      const id = ytId(slide.dataset.video);
      const div = document.createElement('div');
      wrap.appendChild(div);
      ytPlayers[slide.dataset.pk] = new YT.Player(div, {
        videoId: id,
        playerVars: {controls:0, loop:1, playlist:id, playsinline:1, mute:1, rel:0, modestbranding:1},
      });
    });
  }

  function playSlide(slide){
    const video = slide.querySelector('.short-video');
    if(video){ video.muted = muted; video.play().catch(()=>{}); }
    const pk = slide.dataset.pk;
    if(ytPlayers[pk]){ try{ytPlayers[pk].playVideo(); if(muted)ytPlayers[pk].mute(); else ytPlayers[pk].unMute();}catch(e){} }
    slide.dataset.paused = '0';
    const pauseIcon = slide.querySelector('.short-pause-icon');
    if(pauseIcon) pauseIcon.style.display = 'none';
    if(!slide.dataset.viewed){
      slide.dataset.viewed='1';
      fetch(`/shorts/${pk}/view/`, {method:'POST', headers:{'X-CSRFToken':getCookie('csrftoken')}});
    }
  }
  function pauseSlide(slide){
    const video = slide.querySelector('.short-video');
    if(video) video.pause();
    const pk = slide.dataset.pk;
    if(ytPlayers[pk]){ try{ytPlayers[pk].pauseVideo();}catch(e){} }
    slide.classList.remove('controls-shown');
    slide.dataset.paused = '0';
    const pauseIcon = slide.querySelector('.short-pause-icon');
    if(pauseIcon) pauseIcon.style.display = 'none';
  }

  let hideTimer = null;
  function showControls(slide, autoHide){
    slide.classList.add('controls-shown');
    if(hideTimer) clearTimeout(hideTimer);
    if(autoHide){
      hideTimer = setTimeout(()=>slide.classList.remove('controls-shown'), 2500);
    }
  }

  // ── Tap layer: single tap = play/pause, double tap = like ───────────────
  // (same pattern as Instagram/TikTok — a tap that lands within 300ms of
  // the previous one on the same slide counts as a "double tap".)
  let lastTapTime = 0;
  let lastTapSlide = null;
  let singleTapTimer = null;

  window.shortTapToggle = function(tapLayer, evt){
    const slide = tapLayer.closest('.short-slide');
    const now = Date.now();
    const isDoubleTap = (slide === lastTapSlide) && (now - lastTapTime < 300);
    lastTapTime = now;
    lastTapSlide = slide;

    if(isDoubleTap){
      if(singleTapTimer){ clearTimeout(singleTapTimer); singleTapTimer = null; }
      shortDoubleTapLike(slide, evt);
      return;
    }
    // Wait briefly to see if a second tap follows before treating this as
    // a real single tap — avoids toggling play/pause on the first half of
    // a double-tap.
    singleTapTimer = setTimeout(()=>{ shortSingleTap(slide); }, 220);
  };

  function shortSingleTap(slide){
    const video = slide.querySelector('.short-video');
    const pauseIcon = slide.querySelector('.short-pause-icon');
    const isPaused = slide.dataset.paused === '1';
    if(isPaused){
      if(video) video.play().catch(()=>{});
      const pk = slide.dataset.pk;
      if(ytPlayers[pk]){ try{ytPlayers[pk].playVideo();}catch(e){} }
      slide.dataset.paused = '0';
      if(pauseIcon) pauseIcon.style.display = 'none';
      showControls(slide, true);
    } else {
      if(video) video.pause();
      const pk = slide.dataset.pk;
      if(ytPlayers[pk]){ try{ytPlayers[pk].pauseVideo();}catch(e){} }
      slide.dataset.paused = '1';
      if(pauseIcon) pauseIcon.style.display = 'block';
      showControls(slide, false);
    }
  }

  function shortDoubleTapLike(slide, evt){
    const pk = slide.dataset.pk;
    const likeBtn = slide.querySelector('.short-like-btn');
    // Only actually toggle server-side if not already liked — double-tap
    // in every reels-style app is a "like", not a like/unlike toggle.
    if(likeBtn && likeBtn.style.color !== 'rgb(29, 185, 84)'){
      shortToggleLike(parseInt(pk, 10), likeBtn);
    }
    const burst = slide.querySelector('.short-like-burst');
    if(!burst) return;
    // Position the heart burst at the tap point when we have coordinates
    if(evt && evt.clientX){
      const rect = slide.getBoundingClientRect();
      burst.style.left = (evt.clientX - rect.left) + 'px';
      burst.style.top = (evt.clientY - rect.top) + 'px';
    } else {
      burst.style.left = '50%';
      burst.style.top = '50%';
    }
    burst.style.display = 'block';
    burst.style.opacity = '1';
    burst.style.transform = 'translate(-50%,-50%) scale(.3)';
    burst.style.transition = 'none';
    requestAnimationFrame(()=>{
      burst.style.transition = 'transform .35s cubic-bezier(.17,.89,.32,1.49), opacity .5s ease .35s';
      burst.style.transform = 'translate(-50%,-50%) scale(1.15)';
      setTimeout(()=>{ burst.style.opacity = '0'; }, 380);
      setTimeout(()=>{ burst.style.display = 'none'; }, 900);
    });
  }

  window.shortSeek = function(e, wrap){
    const slide = wrap.closest('.short-slide');
    const video = slide.querySelector('.short-video');
    if(!video || !video.duration) return;
    const rect = wrap.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    video.currentTime = pct * video.duration;
    showControls(slide, !slide.dataset.paused || slide.dataset.paused === '0');
  };

  function bindVideo(video){
    video.addEventListener('timeupdate', ()=>{
      if(!video.duration) return;
      const fill = video.closest('.short-slide').querySelector('.short-seek-fill');
      if(fill) fill.style.width = (video.currentTime / video.duration * 100) + '%';
    });
  }

  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting && entry.intersectionRatio > 0.6){
        playSlide(entry.target);
        maybeLoadMore(entry.target);
      }
      else pauseSlide(entry.target);
    });
  }, {threshold:[0,0.6,1]});

  function wireUpSlides(newSlides){
    newSlides.forEach(slide=>{
      const video = slide.querySelector('.short-video');
      if(video) bindVideo(video);
      io.observe(slide);
    });
  }
  wireUpSlides(slides);
  maybeLoadYT();

  if(slides.length) setTimeout(()=>playSlide(slides[0]), 200);

  // ── Infinite scroll ──────────────────────────────────────────────────
  let offset = slides.length;
  let loadingMore = false;
  let hasMore = {{ has_more|yesno:'true,false' }};
  const loadingIndicator = document.getElementById('short-loading-more');

  function maybeLoadMore(activeSlide){
    if(loadingMore || !hasMore) return;
    const all = document.querySelectorAll('.short-slide');
    const idx = [...all].indexOf(activeSlide);
    if(idx < all.length - 3) return;
    loadingMore = true;
    if(loadingIndicator) loadingIndicator.style.display = 'flex';
    fetch(`/shorts/more/?offset=${offset}`)
      .then(r=>r.json())
      .then(d=>{
        if(d.ok && d.html){
          const tmp = document.createElement('div');
          tmp.innerHTML = d.html;
          const added = [...tmp.querySelectorAll('.short-slide')];
          added.forEach(s=>slidesWrap.appendChild(s));
          offset += added.length;
          hasMore = d.has_more;
          wireUpSlides(added);
          maybeLoadYT();
        } else {
          hasMore = false;
        }
      })
      .catch(()=>{})
      .finally(()=>{
        loadingMore = false;
        if(loadingIndicator) loadingIndicator.style.display = 'none';
      });
  }

  window.shortToggleMute = function(btn){
    muted = !muted;
    localStorage.setItem('nexus_shorts_muted', muted ? '1' : '0');
    document.getElementById('short-tap-hint').style.opacity = '0';
    document.querySelectorAll('.short-video').forEach(v=>v.muted=muted);
    Object.values(ytPlayers).forEach(p=>{try{muted?p.mute():p.unMute();}catch(e){}});
    setMuteIcon();
  };

  window.shortToggleLike = async function(pk, btn){
    const res = await fetch(`/shorts/${pk}/like/`, {method:'POST', headers:{'X-CSRFToken':getCookie('csrftoken')}});
    const data = await res.json();
    if(data.ok){
      document.querySelectorAll(`.short-like-btn[data-pk="${pk}"]`).forEach(b=>{
        b.style.color = data.liked ? '#1db954' : '#fff';
        const countEl = b.querySelector('.short-like-count');
        if(countEl) countEl.textContent = data.like_count;
      });
    }
  };

  window.shortOpenComments = function(pk){
    if(typeof openShortComments === 'function') openShortComments(pk);
  };
})();
</script>
{% endblock %}

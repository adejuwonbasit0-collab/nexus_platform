{% extends 'base.html' %}
{% block title %}Shorts — NEXUS{% endblock %}
{% block content %}
<div id="shorts-root" style="position:fixed;inset:0;background:#000;z-index:400;overflow-y:scroll;scroll-snap-type:y mandatory;">
  <a href="/" style="position:fixed;top:16px;left:16px;z-index:410;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:16px;"><i class="fa-solid fa-arrow-left"></i></a>

  <div id="short-tap-hint" style="position:fixed;top:64px;right:16px;z-index:411;background:rgba(0,0,0,.65);color:#fff;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:16px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;">🔊 Tap the speaker for sound</div>

  {% if shorts %}
  <div id="short-slides">{% include 'shorts/_slides.html' %}</div>
  {% else %}
  <div style="height:100vh;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);flex-direction:column;gap:10px;">
    <div style="font-size:40px;">🎬</div>
    <div>No shorts yet — check back soon.</div>
  </div>
  {% endif %}
  <div id="short-loading-more" style="display:none;height:60px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:12px;">Loading more…</div>
</div>

<style>
  body{overflow:hidden;}
  .short-slide iframe{width:100%;height:100%;border:none;}
  .short-seek-wrap{opacity:0;pointer-events:none;transition:opacity .2s;}
  .short-slide.controls-shown .short-seek-wrap{opacity:1;pointer-events:auto;}
</style>

<script>
(function(){
  const root = document.getElementById('shorts-root');
  const slidesWrap = document.getElementById('short-slides');
  let slides = [...document.querySelectorAll('.short-slide')];
  let ytPlayers = {};
  let ytApiReady = false;

  // Sound preference persists across visits (localStorage), not just this
  // page load — previously every fresh visit silently reset to muted with
  // no obvious way to tell that was even the state, which is why shorts
  // "never" seemed to have sound. We still have to start every autoplay
  // muted (mobile browsers block unmuted autoplay outright), but we
  // restore the user's choice the moment the page is interactive.
  let muted = localStorage.getItem('nexus_shorts_muted') !== '0';

  function setMuteIcon(){
    document.querySelectorAll('.short-mute-btn i').forEach(i=>{
      i.className = muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
    });
  }
  setMuteIcon();

  // Nudge new visitors toward the sound button once, since it's a small
  // top-right icon that's easy to miss entirely.
  if(muted && !localStorage.getItem('nexus_shorts_hint_seen')){
    const hint = document.getElementById('short-tap-hint');
    setTimeout(()=>{ hint.style.opacity = '1'; }, 700);
    setTimeout(()=>{ hint.style.opacity = '0'; }, 4200);
    localStorage.setItem('nexus_shorts_hint_seen', '1');
  }

  // Load YouTube iframe API only if at least one short needs it
  function maybeLoadYT(){
    if(window.__nexusYtLoading) { if(ytApiReady) initYT(); return; }
    if(!slides.some(s=>s.dataset.youtube==='1')) return;
    window.__nexusYtLoading = true;
    const tag=document.createElement('script'); tag.src='https://www.youtube.com/iframe_api';
    document.body.appendChild(tag);
    window.onYouTubeIframeAPIReady = function(){ ytApiReady = true; initYT(); };
  }
  maybeLoadYT();

  function ytId(url){
    const m = url.match(/(?:v=|youtu\.be\/|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : '';
  }

  function initYT(){
    slides.forEach(slide=>{
      if(slide.dataset.youtube!=='1') return;
      const wrap = slide.querySelector('.short-yt-wrap');
      if(!wrap || wrap.dataset.ready) return;
      wrap.dataset.ready='1';
      const id = ytId(slide.dataset.video);
      const div = document.createElement('div');
      wrap.appendChild(div);
      ytPlayers[slide.dataset.pk] = new YT.Player(div, {
        videoId: id,
        playerVars: {controls:0, loop:1, playlist:id, playsinline:1, mute:1, rel:0, modestbranding:1},
      });
    });
  }

  function playSlide(slide){
    const video = slide.querySelector('.short-video');
    if(video){ video.muted = muted; video.play().catch(()=>{}); }
    const pk = slide.dataset.pk;
    if(ytPlayers[pk]){ try{ytPlayers[pk].playVideo(); if(muted)ytPlayers[pk].mute(); else ytPlayers[pk].unMute();}catch(e){} }
    slide.dataset.paused = '0';
    const pauseIcon = slide.querySelector('.short-pause-icon');
    if(pauseIcon) pauseIcon.style.display = 'none';
    // Count a view once per slide activation
    if(!slide.dataset.viewed){
      slide.dataset.viewed='1';
      fetch(`/shorts/${pk}/view/`, {method:'POST', headers:{'X-CSRFToken':getCookie('csrftoken')}});
    }
  }
  function pauseSlide(slide){
    const video = slide.querySelector('.short-video');
    if(video) video.pause();
    const pk = slide.dataset.pk;
    if(ytPlayers[pk]){ try{ytPlayers[pk].pauseVideo();}catch(e){} }
    slide.classList.remove('controls-shown');
    slide.dataset.paused = '0';
    const pauseIcon = slide.querySelector('.short-pause-icon');
    if(pauseIcon) pauseIcon.style.display = 'none';
  }

  let hideTimer = null;
  function showControls(slide, autoHide){
    slide.classList.add('controls-shown');
    if(hideTimer) clearTimeout(hideTimer);
    if(autoHide){
      hideTimer = setTimeout(()=>slide.classList.remove('controls-shown'), 2500);
    }
  }

  window.shortTapToggle = function(tapLayer){
    const slide = tapLayer.closest('.short-slide');
    const video = slide.querySelector('.short-video');
    const pauseIcon = slide.querySelector('.short-pause-icon');
    const isPaused = slide.dataset.paused === '1';
    if(isPaused){
      if(video) video.play().catch(()=>{});
      const pk = slide.dataset.pk;
      if(ytPlayers[pk]){ try{ytPlayers[pk].playVideo();}catch(e){} }
      slide.dataset.paused = '0';
      if(pauseIcon) pauseIcon.style.display = 'none';
      showControls(slide, true); // briefly confirm the seek position, then fade
    } else {
      if(video) video.pause();
      const pk = slide.dataset.pk;
      if(ytPlayers[pk]){ try{ytPlayers[pk].pauseVideo();}catch(e){} }
      slide.dataset.paused = '1';
      if(pauseIcon) pauseIcon.style.display = 'block';
      showControls(slide, false); // stay visible while paused, like Reels/TikTok
    }
  };

  window.shortSeek = function(e, wrap){
    const slide = wrap.closest('.short-slide');
    const video = slide.querySelector('.short-video');
    if(!video || !video.duration) return;
    const rect = wrap.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    video.currentTime = pct * video.duration;
    showControls(slide, !slide.dataset.paused || slide.dataset.paused === '0');
  };

  function bindVideo(video){
    video.addEventListener('timeupdate', ()=>{
      if(!video.duration) return;
      const fill = video.closest('.short-slide').querySelector('.short-seek-fill');
      if(fill) fill.style.width = (video.currentTime / video.duration * 100) + '%';
    });
  }

  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting && entry.intersectionRatio > 0.6){
        playSlide(entry.target);
        maybeLoadMore(entry.target);
      }
      else pauseSlide(entry.target);
    });
  }, {threshold:[0,0.6,1]});

  function wireUpSlides(newSlides){
    newSlides.forEach(slide=>{
      const video = slide.querySelector('.short-video');
      if(video) bindVideo(video);
      io.observe(slide);
    });
  }
  wireUpSlides(slides);
  maybeLoadYT();

  // Kick off the first slide immediately (observer needs a scroll/paint tick)
  if(slides.length) setTimeout(()=>playSlide(slides[0]), 200);

  // ── Infinite scroll ──────────────────────────────────────────────────
  // The feed used to hard-stop after a fixed batch (it would only ever
  // surface the 60 newest shorts, then dead-end with nothing left to
  // scroll to). Now it keeps fetching further batches as the visitor
  // nears the end, and loops back to the start of the same shuffled
  // order once every short has been shown — same endless-scroll feel as
  // TikTok/Reels instead of stopping short.
  let offset = slides.length;
  let loadingMore = false;
  let hasMore = {{ has_more|yesno:'true,false' }};
  const loadingIndicator = document.getElementById('short-loading-more');

  function maybeLoadMore(activeSlide){
    if(loadingMore || !hasMore) return;
    const all = document.querySelectorAll('.short-slide');
    const idx = [...all].indexOf(activeSlide);
    if(idx < all.length - 3) return; // only fetch once we're near the end
    loadingMore = true;
    if(loadingIndicator) loadingIndicator.style.display = 'flex';
    fetch(`/shorts/more/?offset=${offset}`)
      .then(r=>r.json())
      .then(d=>{
        if(d.ok && d.html){
          const tmp = document.createElement('div');
          tmp.innerHTML = d.html;
          const added = [...tmp.querySelectorAll('.short-slide')];
          added.forEach(s=>slidesWrap.appendChild(s));
          offset += added.length;
          hasMore = d.has_more;
          wireUpSlides(added);
          maybeLoadYT();
        } else {
          hasMore = false;
        }
      })
      .catch(()=>{})
      .finally(()=>{
        loadingMore = false;
        if(loadingIndicator) loadingIndicator.style.display = 'none';
      });
  }

  window.shortToggleMute = function(btn){
    muted = !muted;
    localStorage.setItem('nexus_shorts_muted', muted ? '1' : '0');
    document.getElementById('short-tap-hint').style.opacity = '0';
    document.querySelectorAll('.short-video').forEach(v=>v.muted=muted);
    Object.values(ytPlayers).forEach(p=>{try{muted?p.mute():p.unMute();}catch(e){}});
    setMuteIcon();
  };

  window.shortToggleLike = async function(pk, btn){
    const fd = new FormData(); fd.append('csrfmiddlewaretoken', getCookie('csrftoken'));
    try{
      const r = await fetch(`/shorts/${pk}/like/`, {method:'POST', body:fd});
      if(r.status === 302 || r.redirected){ window.location.href='/auth/login/?next=/shorts/'; return; }
      const d = await r.json();
      btn.style.color = d.liked ? '#1db954' : '#fff';
      btn.querySelector('.short-like-count').textContent = d.like_count;
    }catch(e){}
  };

  window.shortOpenComments = async function(pk){
    let layer=document.getElementById('sp-queue-layer'); // reuse pattern, separate layer below
    let clayer=document.getElementById('short-comments-layer');
    if(!clayer){
      clayer=document.createElement('div');
      clayer.id='short-comments-layer';
      clayer.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:900;display:flex;align-items:flex-end;justify-content:center;';
      clayer.onclick=(e)=>{if(e.target===clayer)clayer.style.display='none'};
      document.body.appendChild(clayer);
    }
    clayer.innerHTML = `<div style="background:#161616;width:100%;max-width:480px;max-height:70vh;border-radius:16px 16px 0 0;padding:18px;display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-shrink:0;">
        <div style="font-weight:800;color:#fff;font-size:15px;">Comments</div>
        <button onclick="document.getElementById('short-comments-layer').style.display='none'" style="background:none;border:none;color:rgba(255,255,255,.6);font-size:20px;cursor:pointer;">&times;</button>
      </div>
      <div id="short-comments-list" style="overflow-y:auto;flex:1;margin-bottom:12px;color:rgba(255,255,255,.5);font-size:13px;">Loading…</div>
      <form onsubmit="shortPostComment(event, ${pk})" style="display:flex;gap:8px;flex-shrink:0;">
        <input id="short-comment-input" placeholder="Add a comment…" style="flex:1;background:#222;border:1px solid #333;border-radius:20px;padding:9px 14px;color:#fff;font-size:13px;">
        <button type="submit" style="background:#1db954;border:none;border-radius:50%;width:36px;height:36px;color:#000;cursor:pointer;"><i class="fa-solid fa-arrow-up"></i></button>
      </form>
    </div>`;
    clayer.style.display='flex';
    try{
      const r = await fetch(`/shorts/${pk}/comments/`);
      const d = await r.json();
      const list = document.getElementById('short-comments-list');
      if(!d.comments.length){ list.innerHTML = 'No comments yet — say something!'; return; }
      list.innerHTML = d.comments.map(c=>`
        <div style="display:flex;gap:10px;margin-bottom:14px;">
          <div style="width:32px;height:32px;border-radius:50%;background:#333;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;">
            ${c.avatar_url?`<img src="${c.avatar_url}" style="width:100%;height:100%;object-fit:cover">`:c.username.slice(0,1).toUpperCase()}
          </div>
          <div>
            <div style="font-size:12.5px;font-weight:700;color:#fff;">${c.username}</div>
            <div style="font-size:13px;color:rgba(255,255,255,.8);">${c.text}</div>
          </div>
        </div>`).join('');
    }catch(e){}
  };

  window.shortPostComment = async function(e, pk){
    e.preventDefault();
    const input = document.getElementById('short-comment-input');
    const text = input.value.trim();
    if(!text) return;
    const fd = new FormData(); fd.append('text', text); fd.append('csrfmiddlewaretoken', getCookie('csrftoken'));
    const r = await fetch(`/shorts/${pk}/comments/add/`, {method:'POST', body:fd});
    if(r.redirected || r.status===302){ window.location.href='/auth/login/?next=/shorts/'; return; }
    if(r.ok){ input.value=''; shortOpenComments(pk); }
  };

  function getCookie(name){
    const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return v ? v.pop() : '';
  }

  // Clean up the fixed overlay + restore scroll when navigating away
  window.addEventListener('beforeunload', ()=>{ document.body.style.overflow=''; });
})();
</script>
{% endblock %}
